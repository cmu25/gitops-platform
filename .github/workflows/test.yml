name: Bootstrap environment
on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        type: string

jobs:
  create-repos:
    name: Generate token for Github App
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.create-app.outputs.app_url }}
      config_url: ${{ steps.create-config.outputs.config_url }}
    steps:
      - name: Generate token for GitHub App
        uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Debug token permissions
        run: |
          gh auth status
          gh api /installation/repositories
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          
      - name: Create app repository
        needs: app-token
        id: create-app
        run: |
          echo "app_url=https://github.com/${{ github.repository_owner }}/${{ inputs.app_name }}" >> $GITHUB_OUTPUT
          gh repo create ${{ github.repository_owner }}/${{ inputs.app_name }} \
            --private
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Create config repository
        needs: app-token
        id: create-config
        run: |
          echo "config_url=https://github.com/${{ github.repository_owner }}/${{ inputs.app_name }}-config" >> $GITHUB_OUTPUT
          gh repo create ${{ github.repository_owner }}/${{ inputs.app_name }}-config \
            --private
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

  seed_repos:
    name: Seed Repositories
    runs-on: ubuntu-latest
    needs: create-repos
    steps:
      - name: Print Message
        run: |
          echo "${{ needs.create-repos.outputs.app_url }}"
          echo "${{ needs.create-repos.outputs.config_url }}"