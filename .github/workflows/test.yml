on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "App name"
        required: true
        type: string

jobs:
  create_repos:
    name: Create Repositories
    runs-on: ubuntu-latest
    outputs:
      app_url: ${{ steps.create.outputs.app_url }}
      config_url: ${{ steps.create.outputs.config_url }}
    steps:
      - name: Create repos and set outputs
        id: create
        run: |
          echo "app_url=https://github.com/${{ github.repository_owner }}/${{ inputs.app_name }}" >> $GITHUB_OUTPUT
          echo "config_url=https://github.com/${{ github.repository_owner }}/${{ inputs.app_name }}-config" >> $GITHUB_OUTPUT

  seed_repos:
    name: Seed Repositories
    runs-on: ubuntu-latest
    needs: create_repos
    steps:
      - name: Print repo URLs
        run: |
          echo "${{ needs.create_repos.outputs.app_url }}"
          echo "${{ needs.create_repos.outputs.config_url }}"